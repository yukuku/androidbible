name: Android CI

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  plain-debug:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testPlainDebugUnitTest testPlainReleaseUnitTest

      - name: Build with Gradle
        run: ./gradlew assemblePlainDebug bundlePlainDebug

  # Publishes each PR's signed release APKs (all production flavors) to a
  # Cloudflare Worker (static assets) and comments workers.dev download
  # links on the PR. Each upload is a worker *version* with its own
  # immutable preview URL, so builds never overwrite each other. See
  # cloudflare/pr-preview/README.md for the one-time Cloudflare/secrets
  # setup.
  pr-apk-preview:
    # Needs both the signed APKs and the Cloudflare secrets, neither of
    # which exists for fork PRs, so this runs only for PRs from branches
    # inside this same repo.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: signed-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For posting/updating the preview-link comment on the PR.
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      # Secrets can't be read in a job-level `if`, so probe them here and
      # let every later step key off the result. This keeps CI green on
      # repos/forks where the Cloudflare secrets are not configured.
      - name: Check Cloudflare secrets
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping APK preview deploy (see cloudflare/pr-preview/README.md)."
          fi

      # Downloads the preview-only artifact (APKs + metadata, no AABs or
      # mapping files) staged by signed-release. Files land as
      # <flavor>/release/*.apk, which is the layout make_dist.py expects.
      - name: Download release APKs
        if: steps.cf.outputs.enabled == 'true'
        uses: actions/download-artifact@v7
        with:
          name: pr-preview-apks
          path: apk

      # PR title goes through `env` (not string interpolation into the
      # script) so a crafted title can't inject shell code.
      - name: Stage worker assets
        if: steps.cf.outputs.enabled == 'true'
        env:
          APK_DIR: apk
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 cloudflare/pr-preview/make_dist.py

      - name: Deploy to Cloudflare Workers
        if: steps.cf.outputs.enabled == 'true'
        id: deploy
        working-directory: cloudflare/pr-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if ! npx --yes wrangler@4 versions upload 2>&1 | tee upload.log; then
            # First run on a fresh account: `versions upload` cannot create
            # the worker, but `deploy` can. Bootstrap once, then retry so
            # this build still gets a proper immutable preview URL.
            npx --yes wrangler@4 deploy
            npx --yes wrangler@4 versions upload 2>&1 | tee upload.log
          fi
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' upload.log | head -n1)
          if [ -z "$url" ]; then
            echo "::error::No workers.dev preview URL found in wrangler output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview links on PR
        if: steps.cf.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          marker='<!-- alkitab-pr-apk-preview -->'
          body=$(python3 cloudflare/pr-preview/render_comment.py)
          existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"$marker\"))][0].id // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body"
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body"
          fi

  signed-release:
    # GitHub does not expose repository secrets to PRs from forks (by design),
    # so signed builds only run for: pushes to develop, and PRs from branches
    # inside this same repo. Fork PRs skip this job cleanly.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # `contents: write` is required by the "Create GitHub Pre-Release" step
    # below (gh release create). Overrides the workflow-level read-only default.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          # Need full history so `git log <last-release-tag>..HEAD` in the
          # release step can walk back to the previous release.
          fetch-depth: 0

      - name: Check out proprietary overlay
        uses: actions/checkout@v5
        with:
          repository: yukuku/androidbible-proprietary
          ref: master
          ssh-key: ${{ secrets.PROPRIETARY_DEPLOY_KEY }}
          path: proprietary
          persist-credentials: false

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Build a short label used in artifact names. For PRs we use the PR
      # number and the PR head's short SHA (not github.sha, which on
      # pull_request events is the temporary merge commit). For pushes to
      # develop we fall back to "<branch>-<shortsha>".
      - name: Compute artifact tag
        id: tag
        run: |
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            SHA="${{ github.event.pull_request.head.sha }}"
            LABEL="pr${{ github.event.pull_request.number }}"
          else
            SHA="${GITHUB_SHA}"
            LABEL="${GITHUB_REF_NAME}"
          fi
          echo "tag=${LABEL}-${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build signed release (all production flavors)
        env:
          ALKITAB_PROPRIETARY_DIR: ${{ github.workspace }}/proprietary
          SIGN_KEYSTORE: ${{ runner.temp }}/release.jks
          SIGN_ALIAS: ${{ secrets.SIGN_ALIAS }}
          SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
          BUILD_DIST: ci
        run: |
          ./gradlew \
            assembleYuku_alkitabRelease bundleYuku_alkitabRelease \
            assembleYuku_quick_bibleRelease bundleYuku_quick_bibleRelease \
            assembleSabda_alkitabRelease bundleSabda_alkitabRelease

      # Upload one artifact per flavor so each is downloadable separately
      # from the run page. GitHub always wraps an artifact in a zip, but with
      # one APK + one AAB + one mapping per artifact the zip stays small.
      - name: Upload yuku_alkitab outputs
        uses: actions/upload-artifact@v7
        with:
          name: yuku_alkitab-${{ steps.tag.outputs.tag }}
          if-no-files-found: error
          retention-days: 14
          path: |
            Alkitab/build/outputs/apk/yuku_alkitab/release/*.apk
            Alkitab/build/outputs/bundle/yuku_alkitabRelease/*.aab
            Alkitab/build/outputs/mapping/yuku_alkitabRelease/mapping.txt

      - name: Upload yuku_quick_bible outputs
        uses: actions/upload-artifact@v7
        with:
          name: yuku_quick_bible-${{ steps.tag.outputs.tag }}
          if-no-files-found: error
          retention-days: 14
          path: |
            Alkitab/build/outputs/apk/yuku_quick_bible/release/*.apk
            Alkitab/build/outputs/bundle/yuku_quick_bibleRelease/*.aab
            Alkitab/build/outputs/mapping/yuku_quick_bibleRelease/mapping.txt

      - name: Upload sabda_alkitab outputs
        uses: actions/upload-artifact@v7
        with:
          name: sabda_alkitab-${{ steps.tag.outputs.tag }}
          if-no-files-found: error
          retention-days: 14
          path: |
            Alkitab/build/outputs/apk/sabda_alkitab/release/*.apk
            Alkitab/build/outputs/bundle/sabda_alkitabRelease/*.aab
            Alkitab/build/outputs/mapping/sabda_alkitabRelease/mapping.txt

      # Handoff to the pr-apk-preview job. Deliberately APKs + metadata
      # only: the AABs and mapping files must not end up on a public
      # preview URL. Short retention — the per-flavor artifacts above
      # already keep these same APKs for 14 days.
      - name: Upload APKs for PR preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pr-preview-apks
          if-no-files-found: error
          retention-days: 1
          path: |
            Alkitab/build/outputs/apk/*/release/*.apk
            Alkitab/build/outputs/apk/*/release/output-metadata.json

      - name: Create GitHub Pre-Release
        # Only on direct pushes to develop. PRs (even from same-repo branches)
        # should not publish releases.
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # All three flavors share versionCode/versionName; read from one
          # output-metadata.json that AGP emits next to each APK.
          meta_yuku=Alkitab/build/outputs/apk/yuku_alkitab/release/output-metadata.json
          meta_sabda=Alkitab/build/outputs/apk/sabda_alkitab/release/output-metadata.json
          meta_qb=Alkitab/build/outputs/apk/yuku_quick_bible/release/output-metadata.json

          versionCode=$(jq -r '.elements[0].versionCode' "$meta_yuku")
          versionName=$(jq -r '.elements[0].versionName' "$meta_yuku")
          today=$(date -u +%Y-%m-%d)

          title="${versionName} (${versionCode}) ${today}"
          tag="v${versionCode}"

          src_yuku="$(dirname "$meta_yuku")/$(jq -r '.elements[0].outputFile' "$meta_yuku")"
          src_sabda="$(dirname "$meta_sabda")/$(jq -r '.elements[0].outputFile' "$meta_sabda")"
          src_qb="$(dirname "$meta_qb")/$(jq -r '.elements[0].outputFile' "$meta_qb")"

          # Stage release-only copies with the short, human-friendly filenames
          # the user wants attached to the GH Release. Gradle's own output names
          # (which embed applicationId + build dist) are left alone so CI
          # artifact uploads keep working.
          # Match gradle's `gitCommitHash` exactly (`git log -1 --format=%h`).
          short_hash=$(git log -1 --format=%h)
          stage=release-staging
          mkdir -p "$stage"
          yuku_apk="$stage/Alkitab-${versionCode}-${versionName}-${short_hash}.apk"
          sabda_apk="$stage/SabdaAlkitab-${versionCode}-${versionName}-${short_hash}.apk"
          qb_apk="$stage/QuickBible-${versionCode}-${versionName}-${short_hash}.apk"
          cp "$src_yuku" "$yuku_apk"
          cp "$src_sabda" "$sabda_apk"
          cp "$src_qb" "$qb_apk"

          # Commits since the last GH release. If there is no prior release
          # (first run), fall back to the last 50 commits to keep the body
          # bounded.
          # `.[0].tagName // ""` collapses both "no releases yet" (empty
          # array) and "release missing tagName" to an empty string, so the
          # `-n` check below correctly takes the first-run branch.
          last_tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""' || true)
          # Fetch tags now (not just at checkout time) so we can resolve a tag
          # that another CI run may have created after our checkout step ran.
          # Without this, two PRs merged back-to-back race: the second run's
          # `gh release list` sees the tag the first run just published, but
          # the local clone never fetched it, and `git log <tag>..HEAD` fails
          # with "unknown revision".
          git fetch --tags --no-recurse-submodules
          {
            echo "## Changes"
            echo
            if [ -n "$last_tag" ]; then
              git log "${last_tag}..HEAD" --pretty=format:"- %s (%h)"
            else
              git log HEAD --max-count=50 --pretty=format:"- %s (%h)"
            fi
            echo
          } > changelog.md

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes-file changelog.md \
            --prerelease \
            "$yuku_apk" \
            "$sabda_apk" \
            "$qb_apk"

      - name: Wipe keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
