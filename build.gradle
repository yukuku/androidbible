// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '2.2.0'

    repositories {
        mavenCentral()
        google()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.3'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.5'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
        maven { url "https://jitpack.io" }
    }
}

ext {
    SERVER_HOST = 'https://alkitab-host.appspot.com/'
    RIBKA_FUNCTIONS_HOST = 'https://us-central1-pulau-ribka.cloudfunctions.net/'
    RIBKA_FUNCTIONS_HOST_DEBUG = 'http://10.0.3.2:5001/pulau-ribka/us-central1/'

    compileSdkVersion = 35
    minSdkVersion = 26
    targetSdkVersion = 35

    // Android X
    androidxActivityVersion = '1.10.1'
    androidxAnnotationVersion = '1.6.0'
    androidxAppcompatVersion = '1.7.1'
    androidxConstraintlayoutVersion = '2.2.1'
    androidxCoreVersion = '1.16.0'
    androidxCursoradapterVersion = '1.0.0'
    androidxFragmentVersion = '1.8.8'
    androidxMedia3Version = '1.8.0'
    androidxMultidexVersion = '2.0.1'
    androidxPercentlayoutVersion = '1.0.0'
    androidxPreferenceVersion = '1.2.1'
    androidxRecyclerviewVersion = '1.4.0'
    androidxSwiperefreshlayoutVersion = '1.1.0'
    androidxViewpagerVersion = '1.1.0'

    // Google
    firebaseBomVersion = '29.0.3'
    gsonVersion = '2.13.1'
    materialVersion = '1.12.0'

    // Tests
    junitVersion = '4.13.2'
    leakcanaryVersion = '2.14'

    // Misc
    coilVersion = '2.7.0'
    fancyShowcaseViewVersion = '1.4.0'
    fastscrollVersion = '1.3.0'
    kotlinxSerializationJsonVersion = '1.5.1'
    materialDialogsVersion = '3.3.0'
    okhttpVersion = '5.0.0'

    // Youtube-Player
    youtubePlayerVersion = '12.1.2'
}
