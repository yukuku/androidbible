/**
 * Mirrors the contents of {@code text_raw/} from a proprietary overlay directory
 * into {@code <outputDir>/internal/}, so that the result can be wired into a
 * product flavor's assets via AGP's {@code addGeneratedSourceDirectory}. The
 * Sync semantics ensure that removed files in the source disappear from the
 * output, and the typed {@code DirectoryProperty} output lets every downstream
 * AGP task (mergeAssets, lint vital, etc.) automatically depend on this task.
 */
abstract class CopyProprietaryAssetsTask extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getSourceDir()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @Inject
    abstract FileSystemOperations getFs()

    @TaskAction
    void copyAssets() {
        fs.sync {
            from sourceDir
            into outputDir.dir("internal")
        }
    }
}

def googleServicesFile = file('google-services.json')
def googleServicesJson = googleServicesFile.exists() ? new JsonSlurper().parse(googleServicesFile) : null

def resolveFirebaseApiKey = { String applicationId ->
    if (googleServicesJson == null) return null

    def client = googleServicesJson.client?.find {
        it.client_info?.android_client_info?.package_name == applicationId
    }
    return client?.api_key?.find { it.current_key != null }?.current_key
}

def hasUsableFirebaseApiKey = { String applicationId ->
    def apiKey = resolveFirebaseApiKey(applicationId)
    if (apiKey == null) return false

    def trimmed = apiKey.trim()
    return !trimmed.isEmpty() && !(trimmed ==~ /0+/)
}

// Last git commit hash, baked into BuildConfig.LAST_COMMIT_HASH and the APK filename.
// Falls back to "0000000" outside of a git checkout (e.g. some CI source archives).
def gitCommitHash = "0000000"
try {
    gitCommitHash = providers.exec {
        commandLine 'git', 'log', '-1', '--format=format:%h'
    }.standardOutput.asText.get().trim()
    if (gitCommitHash.isEmpty()) {
        gitCommitHash = "0000000"
    }
} catch (Exception ignored) {
    // not a git checkout, leave as "0000000"
}

// Map of production (non-plain) flavor name -> overlay subdirectory name under
// $ALKITAB_PROPRIETARY_DIR/overlay/. The overlay subdirectory matches the
// applicationId of the corresponding flavor.
def proprietaryFlavors = [
    yuku_alkitab    : 'yuku.alkitab',
    yuku_quick_bible: 'yuku.alkitab.kjv',
    sabda_alkitab   : 'org.sabda.alkitab',
]
def proprietaryDir = System.getenv("ALKITAB_PROPRIETARY_DIR")

