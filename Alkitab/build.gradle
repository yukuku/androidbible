import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id "kotlin-parcelize"
    id 'com.google.firebase.crashlytics'
    id 'kotlinx-serialization'
}

def googleServicesFile = file('google-services.json')
def googleServicesJson = googleServicesFile.exists() ? new JsonSlurper().parse(googleServicesFile) : null

def resolveFirebaseApiKey = { String applicationId ->
    if (googleServicesJson == null) return null

    def client = googleServicesJson.client?.find {
        it.client_info?.android_client_info?.package_name == applicationId
    }
    return client?.api_key?.find { it.current_key != null }?.current_key
}

def hasUsableFirebaseApiKey = { String applicationId ->
    def apiKey = resolveFirebaseApiKey(applicationId)
    if (apiKey == null) return false

    def trimmed = apiKey.trim()
    return !trimmed.isEmpty() && !(trimmed ==~ /0+/)
}

android {
    signingConfigs {
        release {
            keyAlias System.getenv("SIGN_ALIAS")
            keyPassword System.getenv("SIGN_PASSWORD")
            storeFile file(System.getenv("SIGN_KEYSTORE") != null ? System.getenv("SIGN_KEYSTORE") : "/dev/null")
            storePassword System.getenv("SIGN_PASSWORD")
        }
    }
    compileSdkVersion rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId 'yuku.alkitab.debug'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 17000532
        versionName '4.11.2'
        multiDexEnabled true
        // Keep this synced with integrate_translations.sh! Also update pref_language.xml and ConfigurationWrapper!
        resourceConfigurations += ['af', 'bg', 'ceb', 'cs', 'da', 'de', 'el', 'es', 'fr', 'hu', 'in', 'it', 'ja', 'ko', 'lv', 'ms', 'my', 'nl', 'pl', 'pt-rBR', 'pt', 'ro', 'ru', 'th', 'tl', 'tr', 'uk', 'vi', 'zh-rCN', 'zh-rTW']
        buildConfigField 'String', 'SERVER_HOST', "\"$SERVER_HOST\""
        buildConfigField 'String', 'RIBKA_FUNCTIONS_HOST', "\"$RIBKA_FUNCTIONS_HOST\""
    }
    buildTypes {
        debug {
            buildConfigField 'String', 'RIBKA_FUNCTIONS_HOST', "\"$RIBKA_FUNCTIONS_HOST_DEBUG\""
            buildConfigField 'boolean', 'SKIP_FCM_REGISTRATION', 'true'
        }
        release {
            buildConfigField 'boolean', 'SKIP_FCM_REGISTRATION', 'false'
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    lint {
        abortOnError false
    }

    flavorDimensions "playStoreApplicationId"

    productFlavors {
        // Use this for development
        plain {
        }

        // The following flavors are for release
        yuku_alkitab {
            applicationId 'yuku.alkitab'
        }
        yuku_quick_bible {
            applicationId 'yuku.alkitab.kjv'
        }
        sabda_alkitab {
            applicationId 'org.sabda.alkitab'
        }
    }
    namespace 'yuku.alkitab.debug'

    buildFeatures {
        buildConfig = true
    }

    // We have to specify the ndk version twice, in here and in the Snappy library
    // https://issuetracker.google.com/issues/353554169
    ndkVersion '28.2.13676358'
}

android.applicationVariants.all { variant ->
    if (!variant.buildType.debuggable) {
        def validateTask = tasks.register("validate${variant.name.capitalize()}FirebaseConfig") {
            doLast {
                if (!hasUsableFirebaseApiKey(variant.applicationId)) {
                    throw new GradleException("Release build '${variant.name}' requires a non-empty Firebase API key in Alkitab/google-services.json for package '${variant.applicationId}'.")
                }
            }
        }

        tasks.named("pre${variant.name.capitalize()}Build").configure {
            dependsOn validateTask
        }
    }
}

